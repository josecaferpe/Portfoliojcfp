name: CD - Auto Deploy

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Conectar por SSH y Desplegar
      uses: appleboy/ssh-action@v0.1.10
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 22
        script: |
          cd /opt/sysops-lab/
          chmod +x /opt/sysops-lab/scripts/*.sh
          ./scripts/deploy.sh
